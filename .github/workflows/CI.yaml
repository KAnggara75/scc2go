name: Go CI/CD with Semantic Versioning

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".pre-commit-config.yaml"
      - ".github/workflows/CI.yaml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".pre-commit-config.yaml"
      - ".github/workflows/CI.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    permissions:
      contents: read
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests with race & coverage
        run: |
          if [ "${{ matrix.go-version }}" = "1.25.x" ]; then
            echo "Running race and coverage on baseline Go..."
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          else
            echo "Running standard tests..."
            go test -v ./...
          fi

      - name: Upload results to Codecov
        if: matrix.go-version == '1.25.x'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  lint-and-sec:
    name: Lint & Security Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Python for pre-commit
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Go tools
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install audit tools
        run: |
          which goimports || go install golang.org/x/tools/cmd/goimports@latest
          which govulncheck || go install golang.org/x/vuln/cmd/govulncheck@latest
          which staticcheck || go install honnef.co/go/tools/cmd/staticcheck@latest
          which gosec || go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run gosec
        run: gosec -exclude-dir=vendor ./...

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build:
    name: Build (Go ${{ matrix.go-version }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [test, lint-and-sec]
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.26.x"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build -v ./...

  create-tag:
    name: Create Tag & Release
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Hitung versi tag (WIB)
        id: ver
        run: |
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          yy=$(date +%y)
          m=$(date +%-m)
          d=$(date +%-d)
          HH=$(date +%H)
          MM=$(date +%M)

          tag="v0.${yy}.${m}-${d}${HH}${MM}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag yang akan dibuat: $tag"

      - name: Cek apakah tag sudah ada
        id: check
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag sudah ada, tidak perlu membuat ulang."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Buat dan push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Auto tag $tag"
          git push origin "$tag"
